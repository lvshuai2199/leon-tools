<!doctype html><meta charset="utf-8"><title>Elite 30001 调试</title>
<style>body{font:14px Arial;background:#151922;color:#eee;margin:24px}input,textarea,button{padding:8px;margin:4px;background:#222938;color:#eee;border:1px solid #48536a;border-radius:4px}textarea{width:90%;height:220px;display:block}.card{display:inline-block;padding:14px;margin:8px;background:#202638;min-width:120px}.v{font-size:22px;color:#6ee7b7}</style>
<h2>Elite Robot Script Debug - TCP 30001</h2><input id="host" value="192.168.249.131"><input id="port" value="30001" size="6"><button onclick="connect()">连接</button><button onclick="disconnect()">断开</button><span id="st">未连接</span>
<div><div class="card">Vx <div id="x" class="v">-</div></div><div class="card">Vy <div id="y" class="v">-</div></div><div class="card">Vz <div id="z" class="v">-</div></div><div class="card">线速度 <div id="l" class="v">-</div></div><div class="card">角速度 <div id="r" class="v">-</div></div></div>
<textarea id="script">textmsg("hello")</textarea><button onclick="send()">通过 30001 发送脚本</button><pre id="log"></pre>
<script>const $=id=>document.getElementById(id);async function api(u,o){let r=await fetch(u,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});return r.json()}async function connect(){let r=await api('/api/connect',{host:$('host').value,port:+$('port').value});$('st').textContent=r.connected?'已连接':'失败'}async function disconnect(){await api('/api/disconnect',{});$('st').textContent='未连接'}async function send(){let r=await api('/api/script',{script:$('script').value});$('log').textContent=JSON.stringify(r)}async function tick(){let r=await (await fetch('/api/state')).json(),v=r.tcp_speed;if(v){const k=1000;$('x').textContent=(v[0]*k).toFixed(2)+' mm/s';$('y').textContent=(v[1]*k).toFixed(2)+' mm/s';$('z').textContent=(v[2]*k).toFixed(2)+' mm/s';$('l').textContent=(Math.hypot(v[0],v[1],v[2])*k).toFixed(2)+' mm/s';$('r').textContent=Math.hypot(v[3],v[4],v[5]).toFixed(4)+' rad/s';$('st').textContent='实时数据 '+new Date(r.updated_at*1000).toLocaleTimeString()}}setInterval(tick,100);</script>
