services:
  leonpro-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: leonpro-backend:latest
    container_name: leonpro-backend
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: unless-stopped
    # MySQL/Redis 若与容器同机且只监听 127.0.0.1，可改为：
    # network_mode: host
    # 并去掉 ports
