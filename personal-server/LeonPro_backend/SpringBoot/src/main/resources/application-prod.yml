spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/leonpro_db_prod?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  data:
    redis:
      url: redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}

server:
  port: 8089

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  mindmap:
    storage-dir: ${MINDMAP_DIR:./data/mindmap}
  wallpaper:
    # original + thumbnail files: {storage-dir}/{groupId}/
    storage-dir: ${WALLPAPER_DIR:./uploads/wallpaper}
    # static URL path mapped to storage-dir
    url-prefix: /uploads/wallpaper
    # public API prefix for /public/wallpaper/random 302 Location and json url/thumbUrl (list APIs stay /uploads/...)
    redirect-prefix: ${WALLPAPER_REDIRECT_PREFIX:/prod-api}
    thumb-width: 640
    max-file-size: 20MB

  # 页面清单同步（menu-sync-design.md）：mode = off | dry-run（只打印计划不写库）| apply
  menu-sync:
    mode: ${MENU_SYNC_MODE:apply}
    # 清单里删掉的页面标记停用（不删行、不删授权）
    disable-missing: ${MENU_SYNC_DISABLE_MISSING:true}

wechat:
  enabled: ${WECHAT_ENABLED:false}
  token: ${WECHAT_TOKEN:}
  crab-operator-username: ${WECHAT_CRAB_USER:admin}
