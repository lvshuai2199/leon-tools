# 数据库 Druid 连接配置
# Java 与 MySQL 同机部署时用 127.0.0.1；可用环境变量 MYSQL_HOST / MYSQL_USER / MYSQL_PASSWORD 覆盖
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/leonpro_db_prod?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # 数据库表更新模式
    show-sql: true  # 是否在控制台显示 SQL 语句

  session:
    store-type: redis  # 使用 Redis 存储会话

  servlet:
    multipart:
      max-file-size: 10MB  # 最大文件大小
      max-request-size: 10MB  # 最大请求大小

  data:
    redis:
      url: redis://${REDIS_HOST:127.0.0.1}:6379

# 端口号设置
server:
  port: 8089  # 应用运行端口

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 驼峰转下划线
