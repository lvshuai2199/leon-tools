spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/leonpro_db_prod?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  data:
    redis:
      url: redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}

server:
  port: 8089

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  mindmap:
    storage-dir: ${MINDMAP_DIR:./data/mindmap}
  notes:
    storage-dir: ${NOTES_DIR:./data/notes-repo}
    poll-millis: ${NOTES_POLL_MILLIS:60000}
    poll-initial-millis: 20000
    max-files: 8000
    max-file-bytes: 1048576
    max-asset-bytes: 20971520
    draft-dir: 随手记
    commit-name: ${NOTES_COMMIT_NAME:LeonPro}
    commit-email: ${NOTES_COMMIT_EMAIL:notes@localhost}
  wallpaper:
    # original + thumbnail files: {storage-dir}/{groupId}/
    storage-dir: ${WALLPAPER_DIR:./uploads/wallpaper}
    # static URL path mapped to storage-dir
    url-prefix: /uploads/wallpaper
    # public API prefix for /public/wallpaper/random 302 Location and json url/thumbUrl (list APIs stay /uploads/...)
    redirect-prefix: ${WALLPAPER_REDIRECT_PREFIX:/prod-api}
    thumb-width: 640
    max-file-size: 20MB

  # 页面清单同步（menu-sync-design.md）：mode = off | dry-run（只打印计划不写库）| apply
  menu-sync:
    mode: ${MENU_SYNC_MODE:apply}
    # 清单里删掉的页面标记停用（不删行、不删授权）
    disable-missing: ${MENU_SYNC_DISABLE_MISSING:true}
    # 允许 jar 里缺清单的端（逗号分隔 admin / app）。默认都不允许：缺清单时启动直接失败（防止打包时没带上前端目录）。
    allow-missing-manifest: ${MENU_SYNC_ALLOW_MISSING_MANIFEST:}
    first-grant:
      # 额外授予用户端出货菜单的角色 id（逗号分隔）。先跑 sql/crab_users_without_menu_check.sql 核对
      # “录过出货单但角色没有出货菜单”的角色，确认后填在这里（例如 role_ops,role_xxx），每个角色只授予一次。
      # docker-compose.yml 会透传 MENU_SYNC_* 环境变量，值写在服务器 /opt/leonpro/backend/.env。
      app-crab-extra-roles: ${MENU_SYNC_APP_CRAB_EXTRA_ROLES:}

wechat:
  enabled: ${WECHAT_ENABLED:false}
  token: ${WECHAT_TOKEN:}
  crab-operator-username: ${WECHAT_CRAB_USER:admin}
