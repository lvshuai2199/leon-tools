# 本地开发默认连新机库；可用 MYSQL_HOST / REDIS_HOST 覆盖
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:124.220.57.33}:${MYSQL_PORT:3306}/leonpro_db_dev?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  data:
    redis:
      url: redis://${REDIS_HOST:124.220.57.33}:${REDIS_PORT:6379}

server:
  port: 8089

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  mindmap:
    storage-dir: ${MINDMAP_DIR:./data/mindmap}
  wallpaper:
    # original + thumbnail files: {storage-dir}/{groupId}/
    storage-dir: ${WALLPAPER_DIR:./uploads/wallpaper}
    # static URL path mapped to storage-dir
    url-prefix: /uploads/wallpaper
    # public API prefix for /public/wallpaper/random 302 Location and json url/thumbUrl (list APIs stay /uploads/...)
    redirect-prefix: ${WALLPAPER_REDIRECT_PREFIX:/dev-api}
    thumb-width: 640
    max-file-size: 20MB

  # 页面清单同步（menu-sync-design.md）：mode = off | dry-run（只打印计划不写库）| apply
  menu-sync:
    mode: ${MENU_SYNC_MODE:apply}
    # 开发库多人共用、各分支清单不同，只增改不停用
    disable-missing: false
    # 本地开发两端都允许缺清单（只打 WARN）；生产见 application-prod.yml
    allow-missing-manifest: ${MENU_SYNC_ALLOW_MISSING_MANIFEST:admin,app}
    first-grant:
      # 额外授予用户端出货菜单的角色 id（逗号分隔），见 sql/crab_users_without_menu_check.sql
      app-crab-extra-roles: ${MENU_SYNC_APP_CRAB_EXTRA_ROLES:}

wechat:
  enabled: ${WECHAT_ENABLED:false}
  token: ${WECHAT_TOKEN:}
  crab-operator-username: ${WECHAT_CRAB_USER:admin}

# 只用来加密用户自己填的 Cursor API Key，不是 Cursor Key 本身。生产环境用环境变量覆盖。
cursor:
  api-base: ${CURSOR_API_BASE:https://api.cursor.com}
  key-secret: ${CURSOR_KEY_SECRET:leonpro-dev-cursor-key}
