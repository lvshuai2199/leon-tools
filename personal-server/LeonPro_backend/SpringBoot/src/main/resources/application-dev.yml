# 数据库 Druid 连接配置
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
#    url: jdbc:mysql://127.0.0.1:3306/leonpro?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai
#    username: root
#    password: 123456
    url: jdbc:mysql://106.12.12.111/leonpro_db_dev?useSSL=false&useUnicode=true&characterEncoding=utf-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: Root@123456  # 请确保在生产环境中妥善管理此密码
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: true
      test-while-idle: true
      test-on-return: false

  jpa:
    hibernate:
      ddl-auto: update  # 数据库表更新模式
      show-sql: true  # 是否在控制台显示 SQL 语句
      properties:
        hibernate:
          format_sql: true

  session:
    store-type: redis  # 使用 Redis 存储会话

  servlet:
    multipart:
      max-file-size: 10MB  # 最大文件大小
      max-request-size: 10MB  # 最大请求大小

  data:
    redis:
      url: redis://106.12.12.111:6379

# 端口号设置
server:
  port: 8089

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true  # 驼峰转下划线
