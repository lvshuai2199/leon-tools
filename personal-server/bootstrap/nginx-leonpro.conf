# LeonPro 站点配置（唯一一份）。服务器上的位置：/etc/nginx/sites-available/default（sites-enabled/default 指向它）。
# 更新用同目录的 deploy-nginx.ps1 / deploy-nginx.sh：先备份、nginx -t 通过才 reload，失败自动回滚。
# 前端部署脚本只上传静态文件，不再改 nginx。
#
#   /            用户端（frontend_phone，history 路由）   /var/www/leonpro-web
#   /admin/      管理端（vue3_frontend，hash 路由）       /var/www/leonpro-admin
#   /prod-api/   后端 127.0.0.1:8089（去掉前缀）；图片也走这里：/prod-api/uploads/...
#   /trace、/cnc/ 保持原样
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	server_name _;

	root /var/www/leonpro-web;
	index index.html;
	client_max_body_size 25m;

	# static tool page
	location /trace {
		alias /var/www/tool/createTrace.html;
		default_type text/html;
	}

	# CNC prototype, separate dir so LeonPro dist does not overwrite it
	location = /cnc {
		return 301 /cnc/;
	}
	location /cnc/ {
		root /var/www;
		index index.html;
	}

	# prod API prefix /prod-api -> local Java 8089 (prefix stripped)
	location /prod-api/ {
		proxy_pass http://127.0.0.1:8089/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# never trust client identity headers; backend derives the user from the Bearer token
		proxy_set_header X-User-Id "";
		proxy_set_header X-Username "";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_connect_timeout 60s;
		proxy_read_timeout 120s;
		proxy_send_timeout 120s;
	}

	# ---------- 管理端 /admin/（hash 路由，不需要回落；找不到的文件就是 404） ----------
	location = /admin {
		absolute_redirect off;
		return 301 /admin/;
	}
	location /admin/ {
		alias /var/www/leonpro-admin/;
		index index.html;
	}
	# 入口页每次都向服务器确认，发版后立即生效
	location = /admin/index.html {
		alias /var/www/leonpro-admin/index.html;
		add_header Cache-Control "no-cache" always;
	}
	# 打包产物文件名带 hash（vite: js/ css/ img/ fonts/ media/），可以长期缓存
	location ~ ^/admin/(js|css|img|fonts|media)/(.+)$ {
		alias /var/www/leonpro-admin/$1/$2;
		add_header Cache-Control "public, max-age=31536000, immutable";
		access_log off;
	}

	# ---------- 用户端 /（history 路由，含 /s/crab/{publicId} 等分享页） ----------
	# 打包产物（vite 默认 assets/，文件名带 hash）长期缓存；缺文件直接 404，不能回落成 index.html 再被缓存一年
	location ^~ /assets/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
		access_log off;
	}
	location = /index.html {
		add_header Cache-Control "no-cache" always;
	}
	location / {
		try_files $uri $uri/ /index.html;
	}
}
