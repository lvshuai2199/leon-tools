<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeonPro 启动台</title>
    <link rel="stylesheet" href="/styles.css?v=6" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>LeonPro 启动台</h1>
        <div class="seg" id="viewSwitch">
          <button type="button" data-view="local" class="active">本机</button>
          <button type="button" data-view="remote">远程</button>
          <button type="button" data-view="config">配置</button>
        </div>
      </header>
      <p id="viewSub" class="status"></p>

      <div class="stage" id="stageTrack" data-view="local">
        <section class="stage-page" data-page="local">
          <section class="card">
            <h2>数据库</h2>
            <div class="seg" data-group="db">
              <button type="button" data-value="dev">Dev</button>
              <button type="button" data-value="prod">Prod</button>
            </div>
            <h2 class="gap">前端接口</h2>
            <div class="seg" data-group="frontendTarget">
              <button type="button" data-value="local">本机</button>
              <button type="button" data-value="remote">服务器</button>
            </div>
            <p id="apiHint" class="status"></p>
          </section>

          <section class="card">
            <div class="row head">
              <h2>服务</h2>
              <div class="actions">
                <button id="startAll" class="btn primary" type="button">全开</button>
                <button id="stopAll" class="btn" type="button">全关</button>
              </div>
            </div>
            <div id="services" class="list"></div>
          </section>
        </section>

        <section class="stage-page" data-page="remote">
          <section class="card">
            <h2>SSH</h2>
            <p id="sshHint" class="status"></p>
            <p id="tunnelHint" class="status"></p>
            <div class="actions">
              <button id="sshTest" class="btn" type="button">测试</button>
              <button id="tunnelStart" class="btn primary" type="button">连接</button>
              <button id="tunnelStop" class="btn" type="button">断开</button>
            </div>
          </section>

          <section class="card">
            <div class="row head">
              <h2>部署</h2>
              <button id="deployAll" class="btn primary" type="button">全部</button>
            </div>
            <label class="check"><input id="skipBuild" type="checkbox" />跳过构建，只上传已有产物</label>
            <div id="deployList" class="list"></div>
          </section>

          <section class="card">
            <h2>生产库 → 开发库</h2>
            <p id="dbCopyHint" class="status"></p>
            <div class="actions">
              <button id="dbRefresh" class="btn" type="button">刷新</button>
              <button id="dbSelectAll" class="btn" type="button">全选</button>
              <button id="dbCopy" class="btn primary" type="button">拷贝</button>
            </div>
            <div id="dbTableList" class="list"></div>
          </section>
        </section>

        <section class="stage-page" data-page="config">
          <section class="card">
            <h2>服务器</h2>
            <label>主机<input id="cfgServerHost" type="text" autocomplete="off" placeholder="124.220.57.33" /></label>
            <div class="row">
              <label>SSH 用户<input id="cfgSshUser" type="text" autocomplete="off" placeholder="ubuntu" /></label>
              <label class="narrow">端口<input id="cfgSshPort" type="text" autocomplete="off" placeholder="22" /></label>
            </div>
          </section>
          <section class="card">
            <h2>目录</h2>
            <label>Spring Boot<input id="cfgPathSpring" type="text" autocomplete="off" /><span class="path-meta" id="cfgMetaSpring"></span></label>
            <label>Vue<input id="cfgPathVue" type="text" autocomplete="off" /><span class="path-meta" id="cfgMetaVue"></span></label>
            <label>手机 H5<input id="cfgPathUni" type="text" autocomplete="off" /><span class="path-meta" id="cfgMetaUni"></span></label>
            <label>bootstrap.env<input id="cfgPathBootstrap" type="text" autocomplete="off" /><span class="path-meta" id="cfgMetaBootstrap"></span></label>
            <div class="actions">
              <button id="saveConfig" class="btn primary" type="button">保存</button>
            </div>
          </section>
        </section>
      </div>

      <section class="card">
        <div class="row head">
          <h2>日志</h2>
          <button id="clearLogs" class="btn" type="button">清空</button>
        </div>
        <pre id="logs" class="log"></pre>
      </section>
    </main>
    <script src="/app.js?v=6"></script>
  </body>
</html>
