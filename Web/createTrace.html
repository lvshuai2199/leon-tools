<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>机器人轨迹分析工具 - 专业纯净版</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #f5f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; border-left: 5px solid #3498db; padding-left: 15px; }
        
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .card { border: 1px solid #e1e4e8; padding: 15px; border-radius: 8px; background: #fff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; font-size: 14px; }
        
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 11px; }
        
        .inspector-panel { position: sticky; top: 20px; }
        .data-display { background: #2d3436; color: #74b9ff; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 13px; min-height: 80px; word-break: break-all; margin: 10px 0; border: 1px solid #000; line-height: 1.5; }
        .data-label { color: #dfe6e9; font-size: 11px; margin-bottom: 5px; }
        
        /* 控制栏 */
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; padding: 12px; background: #f8f9fa; border-radius: 6px; border: 1px solid #dee2e6; flex-wrap: wrap; }
        .checkbox-item { display: flex; align-items: center; font-size: 13px; cursor: pointer; font-weight: 600; color: #444; }
        .checkbox-item input { margin-right: 6px; width: 15px; height: 15px; }

        button { background-color: #3498db; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        .btn-copy { background-color: #e67e22; margin-top: 5px; }
        
        .chart-box { height: 500px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; background: #fff; }
        .status { font-size: 12px; padding: 8px; border-radius: 4px; display: none; margin-bottom: 10px; }
        .success { background: #d4edda; color: #155724; display: block; }
        .hint { font-size: 12px; color: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>机器人轨迹交互分析工具</h1>

    <div class="main-layout">
        <div class="left-column">
            <div class="card">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>粘贴 EliScript 脚本内容 (movej/movel/movep/movec)</label>
                        <textarea id="scriptInput" placeholder="在此粘贴 Elite/A9 脚本内容..."></textarea>
                        <button onclick="processScript()">解析文本</button>
                    </div>
                    <div>
                        <label>导入文件</label>
                        <input type="file" id="fileInput" accept=".csv,.txt,.jbi,.eli" style="margin-bottom:10px; font-size:12px;">
                        <button onclick="processFile()" style="background-color:#27ae60;">读取外部文件</button>
                        <div class="hint">支持 movej/movel/movep/movec，Z 突变 > 5mm 自动断开连线</div>
                    </div>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="controls">
                <label class="checkbox-item">
                    <input type="checkbox" id="showLine" checked onchange="refreshView()"> 显示轨迹连线
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="showPoints" onchange="refreshView()"> 显示轨迹点位
                </label>
                <label class="checkbox-item" style="border-left: 2px solid #ddd; padding-left: 15px; color: #e67e22;">
                    <input type="checkbox" id="showMarkers" onchange="refreshView()"> 显示基准标记点 (Frame)
                </label>
                <label class="checkbox-item" style="border-left: 2px solid #ddd; padding-left: 15px; color: #e74c3c;">
                    <input type="checkbox" id="showArrows" onchange="refreshView()"> 显示姿态箭头 (Orientation)
                </label>
                <div id="statusMsg" class="status" style="margin:0; margin-left:auto;"></div>
            </div>

            <div id="chart3D" class="chart-box"></div>
            <div id="chart2D" class="chart-box"></div>
        </div>

        <!-- 右侧详情面板 -->
        <div class="right-column inspector-panel">
            <div class="card" style="border-top: 4px solid #3498db;">
                <label>🎯 点位数据查看</label>
                
                <div class="data-label">拾取对象:</div>
                <div id="pointType" style="font-weight:bold; color:#2c3e50; font-size:14px; margin-bottom:10px;">未选择点位</div>
                
                <div class="data-label">坐标数组 [X, Y, Z]:</div>
                <div id="pointData" class="data-display">在图中点击点位或轨迹</div>

                <div class="data-label" style="margin-top:12px;">姿态 [Rx, Ry, Rz]:</div>
                <div id="pointOrientation" class="data-display">未选择点位</div>

                <div class="data-label" style="margin-top:12px;">与水平面夹角:</div>
                <div id="pointAngle" class="data-display">未选择点位</div>
                
                <button class="btn-copy" onclick="copyData()">复制坐标</button>
                <div id="copyHint" style="font-size:11px; color:green; margin-top:5px; text-align:center; display:none;">复制成功！</div>

                <div style="margin-top:20px; font-size:12px; color:#666; background:#f1f3f5; padding:12px; border-radius:6px; line-height:1.6;">
                    <strong>操作技巧：</strong><br>
                    • 红色箭头代表工具 Z 轴方向（姿态）。<br>
                    • 橙色虚线代表 <code>movej</code> 关节接近移动。<br>
                    • 绿色圆点代表焊接路径 <code>movep/movel/movec</code>。<br>
                    • 红色菱形代表 <code>full_tracking_frame</code> 基准。<br>
                    • 连线断开处表示机器人发生了大幅度抬升。<br>
                    • 点击点位可在右侧查看姿态与水平面夹角。
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let globalData = { main: [], markers: [] };
    let lastSelectedValue = "";

    // ===== 核心：统一解析所有运动指令的轨迹点（含姿态 rx,ry,rz） =====
    function parseTrajectoryData(text) {
        let data = { main: [], markers: [] };

        // 匹配包含 full_apply_touch_offset([x,y,z,rx,ry,rz]) 的所有运动指令（6 值）
        // movej 通常包裹在 get_inverse_kin() 中，作为接近点
        // movel / movep 是线性/工艺焊道移动
        // movec 是圆弧移动，有两个位姿数组(途经点+终点)
        // 注意：{0,500}? 限制搜索范围，防止跨函数匹配（如 movel(touch_sense_offset(...)) 不含 full_apply_touch_offset）
        const motionReg = /(movej|movel|movep|movec)\s*\([\s\S]{0,500}?full_apply_touch_offset\s*\(\s*\[\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)/g;

        // 匹配 full_tracking_frame 赋值（6 值，但只显示非零的）
        const markerReg = /full_tracking_frame\s*=\s*\[\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)/g;

        // 第一遍：解析所有运动指令（movec 只取第一个数组作为途经点）
        let m;
        while ((m = motionReg.exec(text)) !== null) {
            let type = m[1];
            let pt = {
                x:  parseFloat(m[2]),
                y:  parseFloat(m[3]),
                z:  parseFloat(m[4]),
                rx: parseFloat(m[5]),
                ry: parseFloat(m[6]),
                rz: parseFloat(m[7]),
                type: type
            };
            data.main.push(pt);
        }

        // 第二遍：单独解析 movec 的第二个数组（终点位姿，6 值）
        const movecEndReg = /movec\s*\([\s\S]{0,500}?full_apply_touch_offset\s*\(\s*\[[^\]]+\]\s*\)[\s\S]{0,200}?full_apply_touch_offset\s*\(\s*\[\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)\s*,\s*([^,\]]+)/g;
        while ((m = movecEndReg.exec(text)) !== null) {
            data.main.push({
                x:  parseFloat(m[1]),
                y:  parseFloat(m[2]),
                z:  parseFloat(m[3]),
                rx: parseFloat(m[4]),
                ry: parseFloat(m[5]),
                rz: parseFloat(m[6]),
                type: 'movec_end'
            });
        }

        // 解析 full_tracking_frame 基准标记点（跳过全零初始化值）
        while ((m = markerReg.exec(text)) !== null) {
            let x = parseFloat(m[1]), y = parseFloat(m[2]), z = parseFloat(m[3]),
                rx = parseFloat(m[4]), ry = parseFloat(m[5]), rz = parseFloat(m[6]);
            // 跳过全零的初始化占位
            if (x === 0 && y === 0 && z === 0 && rx === 0 && ry === 0 && rz === 0) continue;
            data.markers.push({ x, y, z, rx, ry, rz });
        }

        // 兜底：CSV 格式（至少 3 列数值，可选 6 列含姿态）
        if (data.main.length === 0 && data.markers.length === 0) {
            const csv = Papa.parse(text.trim(), { dynamicTyping: true, skipEmptyLines: true });
            csv.data.forEach(row => {
                if (row.length >= 3 && typeof row[0] === 'number') {
                    data.main.push({
                        x: row[0], y: row[1], z: row[2],
                        rx: row[3] || 0, ry: row[4] || 0, rz: row[5] || 0,
                        type: 'csv'
                    });
                }
            });
        }

        // 按 type 统计
        let cnt = {};
        data.main.forEach(p => { cnt[p.type] = (cnt[p.type] || 0) + 1; });
        console.log("解析完成 — 总计:", data.main.length, "标记:", data.markers.length, "明细:", cnt);
        return data;
    }

    // ===== 路径预处理 & 自动断路 =====
    function preparePath(points) {
        if (!points || points.length === 0) return { x: [], y: [], z: [], idx: [], types: [] };
        let res = { x: [], y: [], z: [], idx: [], types: [] };
        for (let i = 0; i < points.length; i++) {
            // Z 突变 > 5mm 则自动断开连线（机器人提刀）
            if (i > 0 && Math.abs(points[i].z - points[i-1].z) > 0.005) {
                res.x.push(null); res.y.push(null); res.z.push(null);
                res.idx.push(null); res.types.push(null);
            }
            res.x.push(points[i].x);
            res.y.push(points[i].y);
            res.z.push(points[i].z);
            res.idx.push(i);
            res.types.push(points[i].type || '?');
        }
        return res;
    }

    // 按类型筛选点集，返回独立的 path 结构
    function filterByType(points, types) {
        let filtered = points.filter(p => types.includes(p.type));
        return preparePath(filtered);
    }

    // ===== 姿态工具：Euler 角 (Rx,Ry,Rz) → 工具 Z 轴方向向量 =====
    // 旋转顺序：RotZ(rz) * RotY(ry) * RotX(rx)，提取 Z 轴 [0,0,1] 旋转后的方向
    function eulerToToolZ(rx, ry, rz) {
        let crx = Math.cos(rx), srx = Math.sin(rx);
        let cry = Math.cos(ry), sry = Math.sin(ry);
        let crz = Math.cos(rz), srz = Math.sin(rz);
        // Z 轴方向 [0,0,1] 经 Rx → Ry → Rz 旋转后的结果
        return {
            u: crz * sry * crx + srz * srx,
            v: srz * sry * crx - crz * srx,
            w: cry * crx
        };
    }

    // 计算轨迹包围盒对角线长度，用于自动缩放箭头
    function computeSpan(points) {
        if (!points || points.length === 0) return 0.1;
        let xs = points.map(p => p.x), ys = points.map(p => p.y), zs = points.map(p => p.z);
        let dx = Math.max(...xs) - Math.min(...xs);
        let dy = Math.max(...ys) - Math.min(...ys);
        let dz = Math.max(...zs) - Math.min(...zs);
        return Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.1;
    }

    // ===== 绘图 =====
    function drawCharts(data) {
        if (data.main.length === 0 && data.markers.length === 0) {
            alert("未能识别到有效的轨迹坐标数据（movej/movel/movep/movec），请检查格式。");
            return;
        }

        const showLine   = document.getElementById('showLine').checked;
        const showPoints = document.getElementById('showPoints').checked;
        const showMarkers= document.getElementById('showMarkers').checked;
        const showArrows = document.getElementById('showArrows').checked;

        let mode = 'none';
        if (showLine && showPoints) mode = 'lines+markers';
        else if (showLine) mode = 'lines';
        else if (showPoints) mode = 'markers';

        const traces3D = [], traces2D = [];

        // --- 主线：全部点位（含 Z 突变断线）---
        if (data.main.length > 0) {
            const path = preparePath(data.main);

            // hover 信息里带上运动类型
            let hoverText = path.types.map((t, i) => t ? `Type: ${t}` : '');

            traces3D.push({
                x: path.x, y: path.y, z: path.z,
                name: '完整轨迹 (all)', mode: mode, type: 'scatter3d',
                line: { color: '#3498db', width: 4 },
                marker: { size: 2, color: '#2980b9' },
                customdata: path.idx,
                text: hoverText,
                hovertemplate: 'Idx: %{customdata}<br>X: %{x:.6f}<br>Y: %{y:.6f}<br>Z: %{z:.6f}<br>%{text}<extra></extra>'
            });
            traces2D.push({
                x: path.x, y: path.y, name: '平面投影 (all)', mode: mode, type: 'scatter',
                line: { color: '#3498db', width: 2 },
                marker: { size: 4 },
                customdata: path.idx,
                text: hoverText,
                hovertemplate: 'Idx: %{customdata}<br>X: %{x:.6f}<br>Y: %{y:.6f}<br>%{text}<extra></extra>'
            });

            // --- movej 接近点单独显示（虚线） ---
            const movejPts = data.main.filter(p => p.type === 'movej');
            const movejIdx = data.main.map((p, i) => i).filter(i => data.main[i].type === 'movej');
            if (movejPts.length > 0) {
                traces3D.push({
                    x: movejPts.map(p => p.x),
                    y: movejPts.map(p => p.y),
                    z: movejPts.map(p => p.z),
                    name: 'movej 接近点', mode: 'markers+lines', type: 'scatter3d',
                    line: { color: '#e67e22', width: 2, dash: 'dash' },
                    marker: { size: 4, color: '#e67e22', symbol: 'circle-open' },
                    customdata: movejIdx,
                    hovertemplate: 'Idx: %{customdata}<br>movej<br>X: %{x:.6f}<br>Y: %{y:.6f}<br>Z: %{z:.6f}<extra></extra>'
                });
                traces2D.push({
                    x: movejPts.map(p => p.x),
                    y: movejPts.map(p => p.y),
                    name: 'movej 接近点', mode: 'markers+lines', type: 'scatter',
                    line: { color: '#e67e22', width: 2, dash: 'dash' },
                    marker: { size: 6, color: '#e67e22', symbol: 'circle-open' },
                    customdata: movejIdx,
                    hovertemplate: 'Idx: %{customdata}<br>movej<br>X: %{x:.6f}<br>Y: %{y:.6f}<extra></extra>'
                });
            }

            // --- 焊接路径点 (movep + movel + movec) 单独高亮 ---
            const weldPts = data.main.filter(p => ['movep','movel','movec','movec_end'].includes(p.type));
            const weldIdx = data.main.map((p, i) => i).filter(i => ['movep','movel','movec','movec_end'].includes(data.main[i].type));
            if (weldPts.length > 0) {
                traces3D.push({
                    x: weldPts.map(p => p.x),
                    y: weldPts.map(p => p.y),
                    z: weldPts.map(p => p.z),
                    name: '焊道路径 (movep/movel/movec)', mode: 'markers', type: 'scatter3d',
                    marker: { size: 3, color: '#27ae60', symbol: 'circle' },
                    customdata: weldIdx,
                    hovertemplate: 'Idx: %{customdata}<br>%{text}<br>X: %{x:.6f}<br>Y: %{y:.6f}<br>Z: %{z:.6f}<extra></extra>',
                    text: weldPts.map(p => p.type)
                });
                traces2D.push({
                    x: weldPts.map(p => p.x),
                    y: weldPts.map(p => p.y),
                    name: '焊接路径', mode: 'markers', type: 'scatter',
                    marker: { size: 6, color: '#27ae60', symbol: 'circle' },
                    customdata: weldIdx,
                    hovertemplate: 'Idx: %{customdata}<br>X: %{x:.6f}<br>Y: %{y:.6f}<extra></extra>'
                });
            }
        }

        // --- 基准标记点 (full_tracking_frame) ---
        if (showMarkers && data.markers.length > 0) {
            const mX = data.markers.map(p => p.x),
                  mY = data.markers.map(p => p.y),
                  mZ = data.markers.map(p => p.z);
            traces3D.push({
                x: mX, y: mY, z: mZ, name: '基准标记点 (frame)', mode: 'markers', type: 'scatter3d',
                marker: { color: '#e74c3c', size: 8, symbol: 'diamond' }
            });
            traces2D.push({
                x: mX, y: mY, name: '基准标记点 (frame)', mode: 'markers', type: 'scatter',
                marker: { color: '#e74c3c', size: 10, symbol: 'diamond' }
            });
        }

        // --- 姿态箭头（工具 Z 轴方向） ---
        if (showArrows && data.main.length > 0) {
            let span = computeSpan(data.main);
            let arrowLen = span * 0.06;   // 箭头长度 = 包围盒对角线的 6%

            // 每隔 N 个点采样，避免过于密集
            let step = Math.max(1, Math.floor(data.main.length / 80));
            let arrowPts = [];
            for (let i = 0; i < data.main.length; i += step) {
                let p = data.main[i];
                let dir = eulerToToolZ(p.rx || 0, p.ry || 0, p.rz || 0);
                arrowPts.push({
                    x: p.x, y: p.y, z: p.z,
                    u: dir.u, v: dir.v, w: dir.w
                });
            }

            // 用 scatter3d + 小线段画箭头（比 cone trace 更可控）
            let arrowX = [], arrowY = [], arrowZ = [];
            for (let a of arrowPts) {
                let tipX = a.x + a.u * arrowLen;
                let tipY = a.y + a.v * arrowLen;
                let tipZ = a.z + a.w * arrowLen;
                // 箭杆（从点位到尖端）
                arrowX.push(a.x, tipX, null);
                arrowY.push(a.y, tipY, null);
                arrowZ.push(a.z, tipZ, null);
            }

            traces3D.push({
                x: arrowX, y: arrowY, z: arrowZ,
                name: '姿态箭头 (Tool Z)', mode: 'lines', type: 'scatter3d',
                line: { color: '#e74c3c', width: 2 },
                hoverinfo: 'skip',
                showlegend: true
            });

            // 箭头尖端小点
            let tipX = arrowPts.map(a => a.x + a.u * arrowLen);
            let tipY = arrowPts.map(a => a.y + a.v * arrowLen);
            let tipZ = arrowPts.map(a => a.z + a.w * arrowLen);
            traces3D.push({
                x: tipX, y: tipY, z: tipZ,
                name: '箭头尖端', mode: 'markers', type: 'scatter3d',
                marker: { color: '#c0392b', size: 3, symbol: 'triangle-up' },
                hoverinfo: 'skip',
                showlegend: false
            });
        }

        const layout3D = {
            scene: { aspectmode: 'data', xaxis: {title:'X (m)'}, yaxis: {title:'Y (m)'}, zaxis: {title:'Z (m)'} },
            margin: { l:0, r:0, b:0, t:30 },
            hovermode: 'closest',
            legend: { x: 0.01, y: 1, font: { size: 10 } }
        };
        const layout2D = {
            xaxis: { title: 'X (m)', scaleanchor: 'y' },
            yaxis: { title: 'Y (m)' },
            hovermode: 'closest',
            legend: { x: 0.01, y: 1, font: { size: 10 } }
        };

        Plotly.newPlot('chart3D', traces3D, layout3D);
        Plotly.newPlot('chart2D', traces2D, layout2D);

        // 点击事件
        ['chart3D', 'chart2D'].forEach(id => {
            document.getElementById(id).on('plotly_click', ev => {
                if (ev.points.length > 0) updateInspector(ev.points[0]);
            });
        });

        // 状态栏
        let cnt = {}; data.main.forEach(p => { cnt[p.type] = (cnt[p.type] || 0) + 1; });
        let parts = [];
        if (cnt.movej) parts.push(cnt.movej + ' movej');
        if (cnt.movel) parts.push(cnt.movel + ' movel');
        if (cnt.movep) parts.push(cnt.movep + ' movep');
        if (cnt.movec) parts.push(cnt.movec + ' movec');
        if (cnt.movec_end) parts.push(cnt.movec_end + ' movec_end');
        if (cnt.csv) parts.push(cnt.csv + ' csv');

        const status = document.getElementById('statusMsg');
        status.innerText = `✅ 点位: ${data.main.length} (${parts.join(', ')})${data.markers.length ? ' | 标记: ' + data.markers.length : ''}`;
        status.className = 'status success';
    }

    // ===== 姿态工具：计算工具 Z 轴与水平面的夹角 =====
    function angleWithHorizontal(rx, ry, rz) {
        const dir = eulerToToolZ(rx, ry, rz);
        const len = Math.sqrt(dir.u * dir.u + dir.v * dir.v + dir.w * dir.w) || 1;
        const sinAngle = Math.abs(dir.w) / len;
        return Math.asin(Math.min(1, sinAngle)) * 180 / Math.PI;
    }

    // 优先通过 trace 中的原始索引找到点位；兜底按坐标反查
    function findSelectedPoint(pts) {
        if (pts && Number.isFinite(pts.customdata)) {
            const idx = pts.customdata;
            if (idx >= 0 && idx < globalData.main.length) return globalData.main[idx];
        }

        const eps = 1e-9;
        const match = p =>
            Math.abs(p.x - pts.x) <= eps &&
            Math.abs(p.y - pts.y) <= eps &&
            Math.abs(p.z - pts.z) <= eps;

        return globalData.main.find(match) ||
               (pts.z !== undefined ? globalData.markers.find(match) : null);
    }

    // ===== 右侧面板 =====
    function updateInspector(pts) {
        const traceName = pts.fullData.name || '';
        const x = pts.x.toFixed(6);
        const y = pts.y.toFixed(6);
        const z = pts.z !== undefined ? pts.z.toFixed(6) : "N/A";
        const idx = pts.customdata !== null && pts.customdata !== undefined ? pts.customdata : "-";
        const motionType = pts.text || '';

        document.getElementById('pointType').innerText = `${traceName}  [Idx: ${idx}]  ${motionType}`;
        const valStr = `[${x}, ${y}, ${z}]`;
        document.getElementById('pointData').innerText = valStr;
        lastSelectedValue = valStr;

        const point = findSelectedPoint(pts);
        if (point && Number.isFinite(point.rx)) {
            const oriStr = `[${point.rx.toFixed(6)}, ${point.ry.toFixed(6)}, ${point.rz.toFixed(6)}]`;
            document.getElementById('pointOrientation').innerText = oriStr;

            const angle = angleWithHorizontal(point.rx, point.ry, point.rz);
            document.getElementById('pointAngle').innerText = `${angle.toFixed(2)}° (工具 Z 轴)`;
        } else {
            document.getElementById('pointOrientation').innerText = '该点位无姿态数据';
            document.getElementById('pointAngle').innerText = '该点位无姿态数据';
        }
    }

    function copyData() {
        if (!lastSelectedValue) return;
        navigator.clipboard.writeText(lastSelectedValue).then(() => {
            const hint = document.getElementById('copyHint');
            hint.style.display = 'block';
            setTimeout(() => { hint.style.display = 'none'; }, 2000);
        });
    }

    function refreshView() { drawCharts(globalData); }
    function processScript() {
        const txt = document.getElementById('scriptInput').value;
        globalData = parseTrajectoryData(txt);
        drawCharts(globalData);
    }
    function processFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            globalData = parseTrajectoryData(e.target.result);
            drawCharts(globalData);
        };
        reader.readAsText(file);
    }
</script>

</body>
