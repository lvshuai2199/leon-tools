<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>机器人轨迹分析工具 - 数据交互版</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; background-color: #f5f7f9; margin: 0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; border-left: 5px solid #3498db; padding-left: 15px; }
        
        /* 布局：左侧输入+图表，右侧数据面板 */
        .main-layout { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        
        .card { border: 1px solid #e1e4e8; padding: 15px; border-radius: 8px; background: #fff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #34495e; font-size: 14px; }
        
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 11px; }
        
        /* 数据查看器样式 */
        .inspector-panel { position: sticky; top: 20px; }
        .data-display { background: #2d3436; color: #fab1a0; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 13px; min-height: 100px; word-break: break-all; margin: 10px 0; line-height: 1.5; border: 1px solid #000; }
        .data-label { color: #dfe6e9; font-size: 12px; margin-bottom: 5px; }
        
        .controls { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; padding: 10px; background: #f8f9fa; border-radius: 6px; }
        .checkbox-item { display: flex; align-items: center; font-size: 13px; cursor: pointer; }

        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background-color: #2980b9; }
        .btn-copy { background-color: #e67e22; margin-top: 5px; }
        .btn-copy:hover { background-color: #d35400; }
        
        .chart-box { height: 500px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 20px; }
        .status { font-size: 12px; padding: 8px; border-radius: 4px; display: none; margin-bottom: 10px; }
        .success { background: #d4edda; color: #155724; display: block; }

        .hint { font-size: 12px; color: #7f8c8d; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>机器人轨迹交互分析工具 (数据拾取版)</h1>

    <div class="main-layout">
        <!-- 左侧：输入与图表 -->
        <div class="left-column">
            <div class="card">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>粘贴脚本内容</label>
                        <textarea id="scriptInput" placeholder="在此粘贴 movep 脚本..."></textarea>
                        <button onclick="processScript()">解析文本</button>
                    </div>
                    <div>
                        <label>导入文件</label>
                        <input type="file" id="fileInput" accept=".csv,.txt,.jbi,.eli" style="margin-bottom:10px; font-size:12px;">
                        <button onclick="processFile()" style="background-color:#27ae60;">读取文件</button>
                        <div class="hint">* 规则：Z轴差 > 2mm 自动断开连线</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <label class="checkbox-item"><input type="checkbox" id="showMarkers" onchange="refreshView()"> 显示基准标记点</label>
                <div id="statusMsg" class="status" style="margin:0; margin-left:auto;"></div>
            </div>

            <div id="chart3D" class="chart-box"></div>
            <div id="chart2D" class="chart-box"></div>
        </div>

        <!-- 右侧：详情面板 -->
        <div class="right-column inspector-panel">
            <div class="card" style="border-top: 4px solid #e67e22;">
                <label style="color:#e67e22;">🎯 当前选中点位数据</label>
                
                <div class="data-label">点位属性:</div>
                <div id="pointType" style="font-weight:bold; color:#2c3e50; font-size:14px;">等待点击...</div>
                
                <div class="data-label" style="margin-top:15px;">坐标数据 [X, Y, Z]:</div>
                <div id="pointData" class="data-display">尚未选择任何点</div>
                
                <button class="btn-copy" onclick="copyData()">复制坐标数组</button>
                <div id="copyHint" style="font-size:11px; color:green; margin-top:5px; display:none;">已成功复制到剪贴板！</div>

                <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
                
                <label>操作说明</label>
                <ul style="font-size:12px; color:#666; padding-left:15px; line-height:1.6;">
                    <li>在左侧图中<b>点击</b>具体点位</li>
                    <li>点位颜色越亮(偏黄)代表顺序越靠后</li>
                    <li>基准标记点以<b>橙色菱形</b>显示</li>
                    <li>双击图表可重置视图角度</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    let globalData = { main: [], markers: [] };
    let lastSelectedValue = "";

    // 解析逻辑
    function parseTrajectoryData(text) {
        let data = { main: [], markers: [] };
        const markerReg = /full_tracking_frame\s*=\s*\[\s*(-?\d+\.?\d*[Ee]?-?\d*)\s*,\s*(-?\d+\.?\d*[Ee]?-?\d*)\s*,\s*(-?\d+\.?\d*[Ee]?-?\d*)/g;
        const movepReg = /movep\s*\(full_apply_touch_offset\s*\(\[\s*(-?\d+\.?\d*[Ee]?-?\d*)\s*,\s*(-?\d+\.?\d*[Ee]?-?\d*)\s*,\s*(-?\d+\.?\d*[Ee]?-?\d*)/g;
        
        let m;
        while ((m = markerReg.exec(text)) !== null) data.markers.push({x: parseFloat(m[1]), y: parseFloat(m[2]), z: parseFloat(m[3])});
        while ((m = movepReg.exec(text)) !== null) data.main.push({x: parseFloat(m[1]), y: parseFloat(m[2]), z: parseFloat(m[3])});

        if (data.main.length === 0) {
            const csv = Papa.parse(text.trim(), { dynamicTyping: true, skipEmptyLines: true });
            csv.data.forEach(row => { if (row.length >= 3 && typeof row[0] === 'number') data.main.push({x:row[0], y:row[1], z:row[2]}); });
        }
        return data;
    }

    // 绘图预处理（Z轴跳断 + 渐变色索引）
    function preparePath(points) {
        if (!points || points.length === 0) return { x: [], y: [], z: [], idx: [] };
        let res = { x: [], y: [], z: [], idx: [] };
        for (let i = 0; i < points.length; i++) {
            if (i > 0 && Math.abs(points[i].z - points[i-1].z) > 0.002) {
                res.x.push(null); res.y.push(null); res.z.push(null); res.idx.push(null);
            }
            res.x.push(points[i].x); res.y.push(points[i].y); res.z.push(points[i].z);
            res.idx.push(i); 
        }
        return res;
    }

    function drawCharts(data) {
        const path = preparePath(data.main);
        const showM = document.getElementById('showMarkers').checked;

        // 主轨迹
        const mainTrace = {
            x: path.x, y: path.y, z: path.z,
            name: '主轨迹', mode: 'lines+markers', type: 'scatter3d',
            line: { color: 'rgba(52, 152, 219, 0.4)', width: 3 },
            marker: { size: 3, color: path.idx, colorscale: 'Viridis', showscale: false },
            customdata: path.idx, // 存储索引以便拾取
            hovertemplate: 'Index: %{customdata}<br>X: %{x}<br>Y: %{y}<br>Z: %{z}<extra></extra>'
        };

        const traces3D = [mainTrace];
        const traces2D = [{
            x: path.x, y: path.y, name: '主轨迹', mode: 'lines+markers', type: 'scatter',
            line: { color: '#ccc', width: 1 },
            marker: { size: 6, color: path.idx, colorscale: 'Viridis' },
            customdata: path.idx,
            hovertemplate: 'Index: %{customdata}<br>X: %{x}<br>Y: %{y}<extra></extra>'
        }];

        if (showM && data.markers.length > 0) {
            const mX = data.markers.map(p=>p.x), mY = data.markers.map(p=>p.y), mZ = data.markers.map(p=>p.z);
            const mIdx = data.markers.map((_,i)=>i);
            const markerTrace = {
                x: mX, y: mY, z: mZ, name: '基准标记', mode: 'markers', type: 'scatter3d',
                marker: { color: '#e67e22', size: 5, symbol: 'diamond' },
                customdata: mIdx,
                hovertemplate: 'Frame Index: %{customdata}<br>X: %{x}<br>Y: %{y}<br>Z: %{z}<extra></extra>'
            };
            traces3D.push(markerTrace);
            traces2D.push({
                x: mX, y: mY, name: '基准标记', mode: 'markers', type: 'scatter',
                marker: { color: '#e67e22', size: 10, symbol: 'diamond' },
                customdata: mIdx
            });
        }

        const layout3D = { 
            scene: { aspectmode: 'data', xaxis: {title:'X'}, yaxis: {title:'Y'}, zaxis: {title:'Z'} },
            margin: { l:0, r:0, b:0, t:30 },
            clickmode: 'event+select'
        };
        const layout2D = { xaxis: { scaleanchor: 'y' }, hovermode: 'closest', clickmode: 'event+select' };

        Plotly.newPlot('chart3D', traces3D, layout3D);
        Plotly.newPlot('chart2D', traces2D, layout2D);

        // 绑定点击事件
        [document.getElementById('chart3D'), document.getElementById('chart2D')].forEach(el => {
            el.on('plotly_click', function(data){
                const pts = data.points[0];
                updateInspector(pts);
            });
        });

        const status = document.getElementById('statusMsg');
        status.innerText = `解析成功：${data.main.length}点`;
        status.className = 'status success';
    }

    // 更新右侧面板
    function updateInspector(pts) {
        const type = pts.fullData.name;
        const x = pts.x.toFixed(6);
        const y = pts.y.toFixed(6);
        const z = pts.z !== undefined ? pts.z.toFixed(6) : "N/A";
        const idx = pts.customdata;

        document.getElementById('pointType').innerText = `${type} [第 ${idx} 点]`;
        const valStr = `[${x}, ${y}, ${z}]`;
        document.getElementById('pointData').innerText = valStr;
        lastSelectedValue = valStr;
        
        // 视觉反馈
        document.getElementById('pointData').style.backgroundColor = "#444";
        setTimeout(() => { document.getElementById('pointData').style.backgroundColor = "#2d3436"; }, 200);
    }

    // 复制功能
    function copyData() {
        if (!lastSelectedValue) return;
        navigator.clipboard.writeText(lastSelectedValue).then(() => {
            const hint = document.getElementById('copyHint');
            hint.style.display = 'block';
            setTimeout(() => { hint.style.display = 'none'; }, 2000);
        });
    }

    function refreshView() { if(globalData.main.length > 0) drawCharts(globalData); }
    function processScript() { globalData = parseTrajectoryData(document.getElementById('scriptInput').value); drawCharts(globalData); }
    function processFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => { globalData = parseTrajectoryData(e.target.result); drawCharts(globalData); };
        reader.readAsText(file);
    }
</script>

</body>
</html>
